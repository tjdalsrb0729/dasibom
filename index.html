<style>
/* ===== 스타일: 검정 바탕 + 연두 한 가지 포인트, 모바일 우선, 최대 폭 480px ===== */
:root{color-scheme:dark;--bg:#0e0e10;--card:#1a1a1d;--card2:#242428;--line:#2c2c31;--text:#f4f4f5;--mute:#8d8d95;--accent:#7be495;--accent-soft:rgba(123,228,149,.14)}

button,input,select,textarea{font-family:inherit;font-weight:400}
/* 아이폰은 글자가 16px보다 작은 입력칸을 누르면 화면을 확대하므로 16px 이상으로 맞춤 */
input,select,textarea{font-size:16px}
a,button,select,input,textarea,summary,label{touch-action:manipulation;-webkit-tap-highlight-color:rgba(123,228,149,.2)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 0 calc(104px + env(safe-area-inset-bottom));overflow-x:hidden}
header.top{padding:calc(18px + env(safe-area-inset-top)) 20px 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header.top .pt{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
header.top .nm{font-size:22px;font-weight:700}
header.top .sub{font-size:13px;color:var(--mute);width:100%}
svg{max-width:100%}
h2{font-size:18px;margin:0 0 10px;font-weight:700}
h3{font-size:15px;margin:14px 0 6px;font-weight:700;color:var(--text)}
.card{background:var(--card);border-radius:20px;padding:18px;margin:12px 14px}
.card p{margin:6px 0}
.pad{margin:0 14px}
.muted{color:var(--mute);font-size:13px}
.small{font-size:12px}
.center{text-align:center}
.grow{flex:1;min-width:0}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row.between{justify-content:space-between}

@keyframes sheetup{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}

<script>
/* ==========================================================
   1. 순수 계산 함수
   DOM과 저장소를 쓰지 않는 함수만 모았습니다.
   window.ReviewLogic으로 노출해서 node에서 따로 시험할 수 있습니다.
   ========================================================== */

/* 중요도(0~100)에 따른 처음 기억 안정도(일). 0이면 12일, 100이면 2일 */
function baseStabilityDays(importance) {
  return 12 - 10 * (importance / 100);
}

/* k번 복습을 끝낸 뒤 다음 복습까지의 시간(시간).
   기억 유지율이 60%로 떨어지는 시점을 복습 시점으로 봅니다. */
function reviewIntervalHours(importance, k) {
  var S = baseStabilityDays(importance) * Math.pow(2.2, k);
  return S * 24 * (-Math.log(0.6));
}

/* 시간을 '약 N일 N시간 후' 같은 한국어 문장으로 바꿉니다. */
function formatDuration(hours) {
  if (!isFinite(hours) || hours < 0) return '지금';
  if (hours < 1) return '약 1시간 이내';
  var total = Math.round(hours);
  if (total < 24) return '약 ' + total + '시간 후';
  var days = Math.floor(total / 24);
  var rem = total % 24;
  if (days >= 10 || rem === 0) return '약 ' + days + '일 후';
  return '약 ' + days + '일 ' + rem + '시간 후';
}

/* 시간 t(일)가 지났을 때 기억 유지율. 안정도 S(일) 기준 지수 감쇠 */
function forgettingRate(tDays, S) {
  return Math.exp(-tDays / S);
}

/* 집중도 점수(0~100). 5분 미만이면 계산하지 않고 null */
function densityScore(points, hours) {
  if (hours < 1 / 12) return null;
  return Math.min(100, Math.round(100 * (points / hours) / 3));
}

window.ReviewLogic = {
  baseStabilityDays: baseStabilityDays,
  reviewIntervalHours: reviewIntervalHours,
  formatDuration: formatDuration,
  forgettingRate: forgettingRate,
  densityScore: densityScore
};
</script>

/* ==========================================================
   3. 저장소 (모든 읽기·쓰기는 try/catch로 감쌈)

function sanitize(s) {
  var d = defaultState();
  if (!Array.isArray(s.subjects) || !s.subjects.length) s.subjects = d.subjects;

  if (!s.profile || typeof s.profile !== 'object') s.profile = d.profile;
  if (!s.cheers || typeof s.cheers !== 'object') s.cheers = {};
  if (!s.settings || typeof s.settings !== 'object') s.settings = d.settings;
  if (typeof s.timeOffsetMs !== 'number') s.timeOffsetMs = 0;
  if (!s.subjects.some(function (x) { return x.id === s.timer.subjectId; })) {
    s.timer.subjectId = s.subjects[0].id;
  }
  if (s.timer.running && !s.timer.startedAt) s.timer.running = false;
  if (s.timer.running && !s.timer.lastConfirmAt) s.timer.lastConfirmAt = s.timer.startedAt;
  return s;
}

function load() {
  var base = defaultState();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        for (var k in base) {
          if (parsed[k] !== undefined && parsed[k] !== null) base[k] = parsed[k];
        }
      }
    }
  } catch (e) {
    /* 저장된 값을 읽지 못하면 기본값으로 시작합니다 */
  }
  return sanitize(base);
}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    /* 저장 실패: 메모리 상태로만 계속 동작합니다 */
  }
}

/* ==========================================================
   4. 전역 상태 (저장되지 않는 화면 상태는 ui에 둠)
   ========================================================== */
var state = load();
var ui = {
  tab: 'today',
  draft: { title: '', subjectId: state.subjects[0].id, category: 'concept', importance: 50 },
  addingSubject: false,
  timerSubject: state.timer.subjectId,
  notice: '',
  dialogKind: null,
  demoS: 7,
  showCopy: false,
  copyText: '',
  lastDayKey: null,
  lastDueCount: null,
  pendingImport: null,
  restoreText: '',
  copyNote: '',
  sheetOpen: false,
  focusDraft: false,
  openMore: {}
};
var toastTimer = null;

/* ==========================================================
   5. 시간과 공통 도우미
   ========================================================== */
function nowMs() { return Date.now() + state.timeOffsetMs; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dateKey(ms) {
  var d = new Date(ms);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function todayKey() { return dateKey(nowMs()); }
function hmOf(ms) {
  var d = new Date(ms);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function hmToMin(s) {
  var p = String(s).split(':');
  return (+p[0]) * 60 + (+p[1]);
}
function fmtHM(sec) {
  sec = Math.max(0, Math.floor(sec));
  return Math.floor(sec / 3600) + '시간 ' + Math.floor((sec % 3600) / 60) + '분';
}
function fmtHMS(sec) {
  sec = Math.max(0, Math.floor(sec));
  return pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor((sec % 3600) / 60)) + ':' + pad(sec % 60);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function setText(id, text) {
  var el = document.getElementById(id);
  if (el) el.textContent = text;
}
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2800);
}
function round1(x) { return Math.round(x * 10) / 10; }

/* ==========================================================
   6. 과목과 항목 도우미
   ========================================================== */
function subjById(id) {
  return state.subjects.filter(function (s) { return s.id === id; })[0] || null;
}
function subjName(id) { var s = subjById(id); return s ? s.name : '기타'; }
function findItem(id) {
  return state.items.filter(function (x) { return x.id === id; })[0] || null;
}
function impOf(it) { return typeof it.importance === 'number' ? it.importance : 50; }
function itemPoints(it) {
  if (it.category === 'review') return 1.5;
  if (it.category === 'concept') return 1 + impOf(it) / 100;
  return 1;
}
function makeReview(orig, now, hours) {
  return {
    id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    title: '복습: ' + orig.title,
    subjectId: orig.subjectId,
    category: 'review',
    importance: impOf(orig),
    done: false,
    doneAt: null,
    createdKey: dateKey(now),
    parentId: orig.id,
    dueAt: now + hours * 3600 * 1000,
    reviewCount: 0,
    mastered: false
  };
}
/* 원본 개념의 대기 중 복습 항목을 지움 */
function removePending(origId) {
  state.items = state.items.filter(function (x) {
    return !(x.parentId === origId && !x.done);
  });
}
/* 지금 복습 시각이 된 자동 복습 항목 */
function dueItems() {
  var now = nowMs();
  return state.items.filter(function (it) {
    return it.parentId && !it.done && it.dueAt && it.dueAt <= now;
  }).sort(function (a, b) { return a.dueAt - b.dueAt; });
}
/* 오늘 탭 목록: 오늘 만든 항목 + 아직 안 끝낸 지난 항목 (예정 복습과 지금 복습은 제외) */
function todayList() {
  var tk = todayKey(), now = nowMs();
  return state.items.filter(function (it) {
    if (it.parentId && !it.done && it.dueAt && it.dueAt <= now) return false;
    if (it.createdKey === tk) return true;
    if (it.done) return false;
    if (it.parentId) return false;
    return true;
  });
}
/* 개념을 완료한 뒤 기다리는 다음 복습 항목 (없으면 null) */
function nextReviewOf(id) {
  return state.items.filter(function (x) { return x.parentId === id && !x.done; })[0] || null;
}
/* 연속 공부 일수: 오늘 또는 어제부터 거꾸로 공부 기록이 이어진 날 수 */
function secsOn(key) {
  return key === todayKey() ? todaySeconds() : sessionsTotal(key);
}
function streakDays() {
  var now = nowMs();
  var n = 0;
  var start = todaySeconds() > 0 ? 0 : 1;
  for (var i = start; i < 400; i++) {
    if (secsOn(dateKey(now - i * DAY_MS)) > 0) n++;
    else break;
  }
  return n;
}

/* ==========================================================
   7. 체크리스트 동작
   ========================================================== */
function addItem() {
  var d = ui.draft;
  var title = (d.title || '').trim();
  if (!title) { toast('할 일을 입력해 주세요'); return; }
  state.items.push({
    id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title: title.slice(0, 60),
    subjectId: subjById(d.subjectId) ? d.subjectId : state.subjects[0].id,
    category: d.category,
    importance: d.importance,
    done: false,
    doneAt: null,
    createdKey: todayKey(),
    parentId: null,
    dueAt: null,
    reviewCount: 0,
    mastered: false
  });
  ui.draft.title = '';
  ui.sheetOpen = false;
  save();
  render();
  toast('추가했어요');
}

function addSubject() {
  var inp = document.getElementById('newSubjectInput');
  var name = (inp ? inp.value : '').trim().slice(0, 10);
  if (!name) { toast('과목 이름을 적어 주세요'); return; }
  if (state.subjects.some(function (s) { return s.name === name; })) { toast('이미 있는 과목이에요'); return; }
  var id = 'sub' + Date.now().toString(36);
  state.subjects.push({ id: id, name: name, fruit: '' });
  ui.draft.subjectId = id;
  ui.addingSubject = false;
  save();
  render();
  toast(name + ' 과목을 추가했어요');
}

/* 완료 체크 / 해제. 개념 완료 시 복습 항목을 만들고,
   자동 복습 완료 시 원본의 복습 횟수를 올리고 다음 복습을 만듭니다. */
function toggleItem(id) {
  var it = findItem(id);
  if (!it) return;
  var now = nowMs();

  if (!it.done) {
    if (it.parentId && it.dueAt && it.dueAt > now) {
      toast('아직 때가 안 됐어요. 복습 시각이 되면 체크할 수 있어요');
      return;
    }
    it.done = true;
    it.doneAt = now;

    if (it.parentId) {
      var orig = findItem(it.parentId);
      if (orig) {
        orig.reviewCount = (orig.reviewCount || 0) + 1;
        if (orig.reviewCount < MAX_REVIEW_STEPS) {
          var h2 = reviewIntervalHours(impOf(orig), orig.reviewCount);
          state.items.push(makeReview(orig, now, h2));
          toast(formatDuration(h2) + ' 다음 복습 항목이 생겨요');
        } else {
          orig.mastered = true;
          toast('열매가 가득 열렸어요');
        }
      }
    } else if (it.category === 'concept') {
      it.reviewCount = it.reviewCount || 0;
      var h = reviewIntervalHours(impOf(it), 0);
      state.items.push(makeReview(it, now, h));
      toast(formatDuration(h) + ' 복습 항목이 생겨요');
    }
  } else {
    if (it.parentId) {
      /* 자동 복습을 되돌리면 원본 복습 횟수를 줄이고, 이 항목은 다시 복습 대기가 됨 */
      var parent = findItem(it.parentId);
      if (parent) {
        removePending(parent.id);
        parent.reviewCount = Math.max(0, (parent.reviewCount || 0) - 1);
        parent.mastered = false;
      }
      it.done = false;
      it.doneAt = null;
    } else if (it.category === 'concept') {
      /* 개념 체크를 해제하면 대기 중 복습을 지우고 복습 횟수를 0으로 */
      removePending(it.id);
      it.reviewCount = 0;
      it.mastered = false;
      it.done = false;
      it.doneAt = null;
    } else {
      it.done = false;
      it.doneAt = null;
    }
  }
  save();
  render();
}

/* ==========================================================
   8. 공부 타이머와 집중 확인
   ========================================================== */
function liveSeconds() {
  var t = state.timer;
  if (!t.running || !t.startedAt) return 0;
  return Math.max(0, Math.floor((nowMs() - t.startedAt) / 1000));
}
function sessionsTotal(key) {
  var m = state.sessions[key];
  if (!m) return 0;
  var s = 0;
  for (var id in m) s += (m[id] || 0);
  return s;
}
function todaySeconds() {
  var tk = todayKey();
  var base = sessionsTotal(tk);
  var t = state.timer;
  if (t.running && t.startedAt && dateKey(t.startedAt) === tk) base += liveSeconds();
  return base;
}
function totalSeconds() {
  var s = 0;
  for (var k in state.sessions) s += sessionsTotal(k);
  return s + liveSeconds();
}

function startTimer() {
  var sid = ui.timerSubject;
  if (!subjById(sid)) sid = state.subjects[0].id;
  var now = nowMs();
  state.timer = { running: true, subjectId: sid, startedAt: now, lastConfirmAt: now, promptOpenedAt: null };
  ui.notice = '';
  save();
  render();
  toast(subjName(sid) + ' 공부를 시작했어요');
}

/* 정지: 수동 정지는 지금까지, 자동 정지는 마지막 확인 시각까지만 기록 */
function stopTimer(auto) {
  var t = state.timer;
  if (!t.running) return;
  var end = auto ? t.lastConfirmAt : nowMs();
  var secs = Math.max(0, Math.floor((end - t.startedAt) / 1000));
  var key = dateKey(t.startedAt);
  if (!state.sessions[key]) state.sessions[key] = {};
  state.sessions[key][t.subjectId] = (state.sessions[key][t.subjectId] || 0) + secs;
  state.timer = { running: false, subjectId: t.subjectId, startedAt: null, lastConfirmAt: null, promptOpenedAt: null };
  ui.notice = auto ? '2분 안에 확인이 없어서 마지막으로 확인한 시각까지만 기록했어요.' : '';
  save();
  render();
  if (auto) toast('자동으로 정지했어요');
}

function confirmStudy() {
  state.timer.lastConfirmAt = nowMs();
  state.timer.promptOpenedAt = null;
  save();
  setDialog(null);
  toast('좋아요, 계속 공부해요');
}

/* 확인 창: 페이지 안 대화상자 */
function setDialog(kind) {
  ui.dialogKind = kind;
  if (kind !== 'import') ui.pendingImport = null;
  var root = document.getElementById('dialogRoot');
  if (!root) return;
  if (!kind) { root.innerHTML = ''; return; }
  var html = '';
  if (kind === 'import' && ui.pendingImport) {
    html = '<div class="dialog" role="dialog" aria-modal="true">' +
      '<h2>지금 기록을 덮어쓰고 불러올까요?</h2>' +
      '<p>항목 ' + ui.pendingImport.items.length + '개, 과목 ' + ui.pendingImport.subjects.length + '개</p>' +
      '<p class="muted">지금 기록은 사라지고 파일의 기록으로 바뀌어요.</p>' +
      '<div class="row"><button class="btn" data-act="dialog-cancel">취소</button>' +
      '<button class="btn primary" data-act="import-yes">불러오기</button></div>' +
      '</div>';
    root.innerHTML = '<div class="overlay">' + html + '</div>';
    return;
  }
  if (kind === 'confirm') {
    var left = Math.max(0, Math.ceil((state.timer.promptOpenedAt + CONFIRM_WINDOW_MS - nowMs()) / 1000));
    html = '<div class="dialog" role="dialog" aria-modal="true">' +
      '<h2>아직 공부 중이에요?</h2>' +
      '<p>2분 안에 눌러 주세요. <span id="promptLeft">' + left + '</span>초 남았어요.</p>' +
      '<button class="btn primary big" data-act="confirm-yes">공부 중이에요</button>' +
      '</div>';
  } else if (kind === 'reset') {
    html = '<div class="dialog" role="dialog" aria-modal="true">' +
      '<h2>모든 기록을 지울까요?</h2>' +
      '<p>공부 기록, 할 일, 나무가 모두 사라져요. 되돌릴 수 없어요.</p>' +
      '<div class="row"><button class="btn" data-act="dialog-cancel">취소</button>' +
      '<button class="btn danger" data-act="reset-yes">초기화</button></div>' +
      '</div>';
  }
  root.innerHTML = '<div class="overlay">' + html + '</div>';
}

/* 확인 창이 떠야 하는지 현재 타이머 상태와 맞춤 */
function syncDialog() {
  var t = state.timer;
  var want = t.running && t.promptOpenedAt;
  if (want && ui.dialogKind !== 'confirm') setDialog('confirm');
  else if (!want && ui.dialogKind === 'confirm') setDialog(null);
}

/* 1초마다 실행: 타이머 갱신, 확인 창 판정, 복습 목록 갱신 */
function tick() {
  var now = nowMs();
  var t = state.timer;
  if (t.running) {
    var interval = (state.settings.confirmMinutes || 25) * 60000;
    if (!t.promptOpenedAt && now >= t.lastConfirmAt + interval) {
      t.promptOpenedAt = now;
      save();
    }
    if (t.running && t.promptOpenedAt && now >= t.promptOpenedAt + CONFIRM_WINDOW_MS) {
      stopTimer(true);
      return;
    }
    setText('elapsed', fmtHMS(todaySeconds()));
    setText('todayTotal', fmtHM(liveSeconds()));
    if (t.promptOpenedAt) {
      setText('promptLeft', String(Math.max(0, Math.ceil((t.promptOpenedAt + CONFIRM_WINDOW_MS - now) / 1000))));
    }
  }
  syncDialog();
  var dk = dateKey(now);
  var dueN = dueItems().length;
  if (dk !== ui.lastDayKey || dueN !== ui.lastDueCount) {
    ui.lastDayKey = dk;
    ui.lastDueCount = dueN;
    render();
  }
}

/* ==========================================================
   9. 화면: 홈
   ========================================================== */
/* 과목 칩: 같은 회색 칩에 과목 이름만 다르게. 누르면 고르는 라디오 버튼이 바뀜 */
function subjectChips(group, selectedId, disabled) {
  return state.subjects.map(function (s) {
    var on = s.id === selectedId;
    return '<label class="chip-pick' + (on ? ' on' : '') + (disabled ? ' dis' : '') + '">' +
      '<input type="radio" name="' + group + '" value="' + esc(s.id) + '"' +
      (on ? ' checked' : '') + (disabled ? ' disabled' : '') + '>' +
      '<span>' + esc(s.name) + '</span></label>';
  }).join('');
}

/* 몇 시간 뒤인지 짧게: '3일 뒤', '5시간 뒤' */
function shortAhead(ms) {
  var hours = ms / 3600000;
  if (hours < 1) return '1시간 안';
  if (hours < 23.5) return Math.round(hours) + '시간 뒤';
  return Math.round(hours / 24) + '일 뒤';
}

function itemRow(it, isDue) {
  var now = nowMs();
  var cat = { concept: '개념', problem: '문제', review: '복습' }[it.category] || '기타';
  var meta = '<span class="tag">' + esc(subjName(it.subjectId)) + '</span><span>' + cat + '</span>';
  if (it.parentId) {
    var p = findItem(it.parentId);
    meta += '<span>' + ((p ? p.reviewCount || 0 : 0) + 1) + '번째 복습</span>';
    if (isDue && !it.done) meta += '<span class="hot">지금 복습해요</span>';
    else if (!it.done && it.dueAt && it.dueAt > now) {
      meta += '<span>' + formatDuration((it.dueAt - now) / 3600000) + ' 복습 예정</span>';
    }
  } else if (it.category === 'concept' && it.done) {
    var nx = nextReviewOf(it.id);
    if (nx) meta += '<span>다음 복습 ' + formatDuration((nx.dueAt - now) / 3600000) + '</span>';
  }
  return '<div class="row item' + (it.done ? ' done' : '') + '">' +
    '<button class="check" data-act="toggle" data-id="' + esc(it.id) + '" aria-label="완료 표시">' + (it.done ? '✓' : '') + '</button>' +
    '<div class="grow"><div class="ttl">' + esc(it.title) + '</div><div class="meta">' + meta + '</div></div>' +
    '</div>';
}

function previewText(importance) {
  return '예상 첫 복습 알림: ' + formatDuration(reviewIntervalHours(importance, 0));
}

/* 오늘의 집중 수치: 완료 수, 집중도 점수, 공부 시간 */
function focusInfo() {
  var tk = todayKey(), now = nowMs();
  var points = 0;
  state.items.forEach(function (it) {
    if (it.done && it.doneAt && dateKey(it.doneAt) === tk) points += itemPoints(it);
  });
  var secs = todaySeconds();
  var hours = secs / 3600;
  var score = densityScore(round1(points), hours);
  var pool = state.items.filter(function (it) {
    return it.createdKey === tk && !(it.parentId && !it.done && it.dueAt && it.dueAt > now);
  });
  var doneN = pool.filter(function (it) { return it.done; }).length;
  var rate = pool.length ? Math.round(doneN / pool.length * 100) : null;
  return { secs: secs, hours: hours, score: score, doneN: doneN, total: pool.length, rate: rate };
}

function viewToday() {
  var t = state.timer;
  var shownSubj = t.running ? t.subjectId : ui.timerSubject;
  var f = focusInfo();
  var h = '';

  h += '<section class="card hero">';
  h += '<p class="hero-label">오늘 공부 시간</p>';
  h += '<p class="clock" id="elapsed">' + fmtHMS(f.secs) + '</p>';
  if (t.running) {
    h += '<p class="muted">' + esc(subjName(t.subjectId)) + ' 공부 중 · 이번에 <span id="todayTotal">' + fmtHM(liveSeconds()) + '</span></p>';
  } else {
    h += '<p class="muted">과목을 고르고 공부 시작을 눌러요</p>';
  }
  h += '<div class="chips">' + subjectChips('timerSubj', shownSubj, t.running) +
    '<button class="chip" data-act="subj-toggle">+ 과목</button></div>';
  if (ui.addingSubject) {
    h += '<div class="row"><input id="newSubjectInput" class="input grow" placeholder="새 과목 이름" maxlength="10">';
    h += '<button class="btn primary" data-act="subj-save">추가</button></div>';
  }
  h += '<button class="btn big ' + (t.running ? 'stop' : 'primary') + '" data-act="timer-toggle">' +
    (t.running ? '멈추기' : '공부 시작') + '</button>';
  if (ui.notice) h += '<p class="notice">' + esc(ui.notice) + '</p>';
  h += '</section>';

  var streak = streakDays();
  var lv = f.score === null ? '' : (f.score >= 70 ? '높음' : (f.score >= 40 ? '보통' : '낮음'));
  h += '<div class="stats">';
  h += '<div class="stat"><span class="stat-l">오늘 완료</span><span class="stat-v">' + f.doneN + '/' + f.total + '</span></div>';
  h += '<div class="stat"><span class="stat-l">집중도</span><span class="stat-v">' +
    (f.score === null ? '측정 전' : f.score + '%') + '</span><span class="stat-s">' + lv + '</span></div>';

function weekChart() {
  var now = nowMs(), tk = todayKey();
  var letters = '일월화수목금토';
  var vals = [], labels = [];
  for (var i = 6; i >= 0; i--) {
    var ms = now - i * DAY_MS;
    var key = dateKey(ms);
    var secs = (key === tk) ? todaySeconds() : sessionsTotal(key);
    vals.push(secs / 3600);
    labels.push(letters.charAt(new Date(ms).getDay()));
  }
  var max = Math.max(1, Math.max.apply(null, vals));
  var svg = '<svg viewBox="0 0 300 130" class="graph" role="img">';
  for (var j = 0; j < 7; j++) {
    var bh = vals[j] / max * 80;
    var x = 12 + j * 41;
    var y = 100 - bh;
    svg += '<rect class="wk-track" x="' + x + '" y="20" width="26" height="80" rx="4"/>';
    svg += '<rect class="wk-bar" x="' + x + '" y="' + y + '" width="26" height="' + bh + '" rx="4"/>';
    if (vals[j] > 0) svg += '<text x="' + (x + 13) + '" y="' + (y - 4) + '" text-anchor="middle" class="axis">' + round1(vals[j]) + '</text>';
    svg += '<text x="' + (x + 13) + '" y="118" text-anchor="middle" class="axis">' + labels[j] + '</text>';
  }
  svg += '</svg>';
  return '<section class="card"><h2>이번 주 공부</h2>' + svg + '</section>';
}

/* ==========================================================
   11. 화면: 내 나무 탭
   ========================================================== */
/* 나무 그림 (inline svg). 복습 횟수 0~4에 따라 새싹 → 가장 풍성한 나무로 자람.
   색은 회색 줄기, 연두(var(--accent)) 잎, 흰 열매만 씀. 복습을 놓쳤으면 잎을 흐린 회색으로 */
function treeSvg(reviewCount, mastered, thirsty) {
  var rc = Math.max(0, Math.min(MAX_REVIEW_STEPS, reviewCount || 0));
  var lv = mastered ? 4 : rc;
  var names = ['새싹', '어린 풀', '작은 나무', '큰 나무', '열매 가득'];
  var k = thirsty ? 0.35 : 1;
  var greenStyle = thirsty ? 'fill:#8d8d95' : 'fill:var(--accent)';
  var outline = mastered ? ';stroke:var(--accent);stroke-width:2.5' : '';
  function op(v) { return (v * k).toFixed(2); }
  function leaf(x, y, rx, ry, rot, v) {
    return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '" transform="rotate(' + rot + ' ' + x + ' ' + y + ')" style="' + greenStyle + '" opacity="' + op(v) + '"/>';
  }
  function blob(x, y, r, v) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" style="' + greenStyle + outline + '" opacity="' + op(v) + '"/>';
  }
  function trunk(top, w) {
    return '<line x1="60" y1="124" x2="60" y2="' + top + '" stroke-width="' + w + '" style="stroke:#8d8d95;stroke-linecap:round"/>';
  }
  function branch(x1, y1, x2, y2) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke-width="3" style="stroke:#8d8d95;stroke-linecap:round"/>';
  }
  var body = '';
  if (lv === 0) {
    body += trunk(102, 3);
    body += leaf(51, 99, 9, 5, -30, 0.9) + leaf(69, 95, 9, 5, 30, 0.9);
  } else if (lv === 1) {
    body += trunk(72, 3.5);
    body += leaf(47, 94, 9, 5, -30, 0.8) + leaf(73, 86, 9, 5, 30, 0.8);
    body += leaf(49, 74, 8, 4.5, -35, 0.9) + leaf(71, 66, 8, 4.5, 35, 0.9);
  } else if (lv === 2) {
    body += trunk(84, 6);
    body += blob(60, 62, 22, 0.6);
  } else if (lv === 3) {
    body += trunk(90, 7);
    body += branch(60, 100, 44, 84) + branch(60, 98, 78, 82);
    body += blob(60, 56, 30, 0.7) + blob(44, 66, 14, 0.6) + blob(76, 66, 14, 0.6);
  } else {
    body += trunk(92, 8);
    body += branch(60, 100, 38, 82) + branch(60, 98, 82, 78);
    body += blob(60, 50, 34, 0.6) + blob(34, 68, 20, 0.75) + blob(86, 68, 20, 0.75);
  }
  /* 열매: 복습 횟수만큼, 수관 안 정해진 자리에 흰 원 (1회 이하에서는 그리지 않음) */
  if (rc >= 2) {
    var spots = [[50, 58], [70, 58], [60, 46], [60, 68]];
    for (var i = 0; i < rc; i++) {
      body += '<circle cx="' + spots[i][0] + '" cy="' + spots[i][1] + '" r="4.5" style="fill:#f4f4f5;stroke:var(--accent);stroke-width:2"/>';
    }
  }
  /* 다 키운 나무: 위에 연두 점 세 개 */
  if (mastered) {
    body += '<circle cx="28" cy="22" r="2.5" style="fill:var(--accent)"/>';
    body += '<circle cx="60" cy="8" r="3" style="fill:var(--accent)"/>';
    body += '<circle cx="92" cy="22" r="2.5" style="fill:var(--accent)"/>';
  }
  /* 복습을 놓쳤을 때: 한쪽에 회색 물방울 */
  if (thirsty) {
    body += '<path d="M106 30 Q100 39 100 44 A6 6 0 0 0 112 44 Q112 39 106 30 Z" style="fill:none;stroke:#8d8d95;stroke-width:1.8"/>';
  }
  return '<svg viewBox="0 0 120 140" role="img" aria-label="' + names[lv] + '">' +
    '<ellipse cx="60" cy="126" rx="36" ry="5" style="fill:#5a5a60"/>' +
    body + '</svg>';
}

      var thirsty = !tree.mastered && state.items.some(function (x) {

      var pdots = '';

      h += '<div class="tree"><div class="tree-art">' + treeSvg(rc, tree.mastered, thirsty) + '</div>' +

        (thirsty ? '<span class="badge wait">물 줄 시간</span>' : '') +

    h += '</div></section>';

  return h;

/* ==========================================================
   12. 화면: 친구 탭 (클릭형 응원, 채팅 입력칸 없음)
   ========================================================== */
/* 친구의 오늘 공부 시간(분, 20~240)을 날짜를 씨앗으로 하는 의사난수로 정함 */
function friendMinutes(friendId, key) {
  var seed = 0, str = friendId + '|' + key, i;
  for (i = 0; i < str.length; i++) seed = (Math.imul(seed, 31) + str.charCodeAt(i)) | 0;
  var x = seed >>> 0;
  for (i = 0; i < 2; i++) x = (Math.imul(x ^ (x >>> 15), 2246822507) + 0x9e3779b9) >>> 0;
  return 20 + (x % 221);
}

function viewMeet() {

    h += '<div class="cal' + (i === 0 ? ' today' : '') + '">' + (d.getMonth() + 1) + '/' + d.getDate() +
      '<span class="sd ' + cls + '"></span></div>';
  }
  h += '</div><p class="muted small">연두 점은 제때 찍은 날, 회색 점은 늦은 날, 빈 점은 안 찍은 날이에요.</p></section>';

  h += '<section class="card"><h2>응원 보내기</h2>';

  FRIENDS.forEach(function (f) {
    var cnt = (state.cheers[f.id] || {})[tk] || 0;
    h += '<div class="row between"><span class="ttl">' + esc(f.name) + '</span><span class="muted">오늘 ' + cnt + '/' + CHEER_LIMIT + '</span></div>';
    h += '<div class="row">';
    CHEER_EMOJI.forEach(function (em) {
      h += '<button class="btn cheer" data-act="cheer" data-friend="' + f.id + '" data-emoji="' + em + '">' + em + '</button>';
    });
    h += '</div>';
  });
  h += '<p class="muted small">친구는 시연용이에요.</p>';
  h += '</section>';

function cheer(friendId, emoji) {
  var f = FRIENDS.filter(function (x) { return x.id === friendId; })[0];
  if (!f) return;
  var tk = todayKey();
  var book = state.cheers[friendId] || (state.cheers[friendId] = {});
  var n = book[tk] || 0;
  if (n >= CHEER_LIMIT) {
    toast('오늘은 ' + f.name + '에게 응원을 ' + CHEER_LIMIT + '번 보냈어요');
    return;
  }
  book[tk] = n + 1;
  save();
  render();
  toast(f.name + '에게 ' + emoji + ' 응원을 보냈어요');
}

function doStamp() {
  var tk = todayKey();
  if (state.stamps[tk]) { toast('오늘 도장은 이미 찍었어요'); return; }
  var now = nowMs();
  var d = new Date(now);
  var cur = d.getHours() * 60 + d.getMinutes();
  var target = state.profile.wakeTarget || '07:00';
  var ok = cur <= hmToMin(target);
  state.stamps[tk] = { time: hmOf(now), target: target, ok: ok };
  save();
  render();
  toast(ok ? '성공 도장을 찍었어요' : '늦은 도장이에요. 내일은 조금 더 일찍 일어나요');
}

/* ==========================================================
   13. 화면: 더보기 탭 (설정, 원리, 기록 보관)
   접는 부분은 <details>로 만들고, 열림 상태는 ui.openMore에 기억함
   ========================================================== */
function openAttr(key) { return ui.openMore[key] ? ' open' : ''; }

/* 망각곡선 SVG를 그림. 슬라이더를 움직일 때 이 부분만 다시 그림 */
function updateGraph() {
  var S = ui.demoS;
  var W = 320, H = 200, L = 38, R = 10, T = 10, B = 28;
  var PW = W - L - R, PH = H - T - B;
  var X = function (t) { return L + t / 30 * PW; };
  var Y = function (p) { return T + (1 - p) * PH; };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="graph" role="img">';

  [0, 0.5, 1].forEach(function (p) {
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(p) + '" y2="' + Y(p) + '" class="gridline"/>';
    svg += '<text x="' + (L - 4) + '" y="' + (Y(p) + 3) + '" text-anchor="end" class="axis">' + (p * 100) + '%</text>';
  });
  [0, 7, 14, 21, 30].forEach(function (t) {
    svg += '<text x="' + X(t) + '" y="' + (H - 8) + '" text-anchor="middle" class="axis">' + t + '일</text>';
  });

  /* 복습하지 않을 때: exp(-t/S) */
  var off = [];
  for (var t = 0; t <= 30; t += 0.5) off.push(X(t).toFixed(1) + ',' + Y(forgettingRate(t, S)).toFixed(1));
  svg += '<polyline class="curve-off" points="' + off.join(' ') + '"/>';

  /* 복습할 때: 복습 시점마다 100%로 올라가고 안정도는 2.2배가 됨 */
  var reviews = [1, 3, 7, 14];
  var bounds = [0].concat(reviews);
  var on = [];
  for (var i = 0; i < bounds.length; i++) {
    var start = bounds[i];
    var end = i + 1 < bounds.length ? bounds[i + 1] : 30;
    var Si = S * Math.pow(2.2, i);
    var n = Math.round((end - start) * 4);
    for (var k = 0; k <= n; k++) {
      var tt = start + (end - start) * k / n;
      on.push(X(tt).toFixed(1) + ',' + Y(forgettingRate(tt - start, Si)).toFixed(1));
    }
  }
  svg += '<polyline class="curve-on" points="' + on.join(' ') + '"/>';
  reviews.forEach(function (r) {
    svg += '<circle cx="' + X(r).toFixed(1) + '" cy="' + Y(1) + '" r="3.5" class="dot"/>';
  });
  svg += '</svg>';

  var box = document.getElementById('graphBox');
  if (box) box.innerHTML = svg;
  setText('halfLife', (S * Math.LN2).toFixed(1) + '일');
}

function exportBackup() {
  var text = '';
  try {
    text = JSON.stringify(state);
    if (typeof Blob === 'undefined' || !window.URL || !URL.createObjectURL) throw new Error('지원 안 됨');
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'bokseupnongjang-backup-' + dateKey(Date.now()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('기록 파일을 저장했어요');
  } catch (e) {
    /* 파일 저장이 안 되면 글로 보여 주고 직접 저장하도록 안내 */
    showCopyBox(text, '파일 저장이 안 돼요. 아래 글을 복사해서 메모장 등에 붙여 넣어 저장해 주세요.');

/* 고른 파일을 글로 읽어서 검사 */
function readBackupFile(file) {
  if (file.size > MAX_IMPORT_BYTES) { toast('파일이 너무 커요. 2MB 이하의 기록만 불러올 수 있어요'); return; }
  try {
    var reader = new FileReader();
    reader.onload = function () { handleImportText(String(reader.result || '')); };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
  } catch (e) {
    toast('파일을 읽지 못했어요');
  }
}

/* 기록 글(문자열)을 검사한 뒤 확인 창을 띄움. 검사에 실패하면 아무것도 바꾸지 않음 */
function handleImportText(text) {
  var str = String(text == null ? '' : text);
  if (!str.trim()) { toast('붙여 넣을 기록 글이 없어요'); return; }
  if (byteLength(str) > MAX_IMPORT_BYTES) { toast('파일이 너무 커요. 2MB 이하의 기록만 불러올 수 있어요'); return; }
  var parsed = null;
  try { parsed = JSON.parse(str); } catch (e) { parsed = null; }
  if (!isPlainObject(parsed) || !Array.isArray(parsed.items) || !Array.isArray(parsed.subjects)) {
    toast('올바른 기록 파일이 아니에요');
    return;
  }
  var next = null;
  try { next = normalizeImported(parsed); } catch (e) { next = null; }
  if (!next) { toast('올바른 기록 파일이 아니에요'); return; }
  ui.pendingImport = next;
  setDialog('import');
}

/* 확인 창에서 '불러오기'를 누르면 기록을 바꾸고 저장 */
function applyImport() {
  var next = ui.pendingImport;
  ui.pendingImport = null;
  setDialog(null);
  if (!next) return;
  state = next;
  if (!subjById(ui.draft.subjectId)) ui.draft.subjectId = state.subjects[0].id;
  ui.timerSubject = state.timer.subjectId;
  ui.addingSubject = false;
  ui.notice = '';
  ui.showCopy = false;
  ui.copyText = '';
  ui.copyNote = '';
  ui.restoreText = '';
  save();
  render();
  toast('기록을 불러왔어요');
}

function isPlainObject(v) {
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}
function cleanStr(v, max) {
  return typeof v === 'string' ? v.slice(0, max) : '';
}
function numOrNull(v) {
  return typeof v === 'number' && isFinite(v) ? v : null;
}
function byteLength(text) {
  try {
    return new Blob([text]).size;
  } catch (e) {
    return text.length * 3;
  }
}

/* 불러온 항목 하나를 필수 필드가 있는 모양으로 바꿈. 쓸 수 없으면 null */
function cleanItem(x) {
  if (!isPlainObject(x)) return null;
  var id = cleanStr(x.id, 80);
  if (!id) return null;
  var imp = typeof x.importance === 'number' && isFinite(x.importance)
    ? Math.min(100, Math.max(0, Math.round(x.importance))) : 50;
  var rc = typeof x.reviewCount === 'number' && isFinite(x.reviewCount) ? Math.floor(x.reviewCount) : 0;
  return {
    id: id,
    title: cleanStr(x.title, 60).trim() || '제목 없음',
    subjectId: cleanStr(x.subjectId, 40),
    category: ['concept', 'problem', 'review'].indexOf(x.category) >= 0 ? x.category : 'problem',
    importance: imp,
    done: x.done === true,
    doneAt: numOrNull(x.doneAt),
    createdKey: DATE_RE.test(x.createdKey) ? x.createdKey : todayKey(),
    parentId: cleanStr(x.parentId, 80) || null,
    dueAt: numOrNull(x.dueAt),
    reviewCount: Math.max(0, Math.min(MAX_REVIEW_STEPS, rc)),
    mastered: x.mastered === true
  };
}

/* 불러올 기록을 정리. 기존 sanitize를 마지막에 거치고, 타이머는 항상 멈춘 상태로 둠 */
function normalizeImported(raw) {
  var base = defaultState();

  /* 과목: 번호와 이름이 있는 것만 남김 */
  var subs = [], seenSub = {};
  raw.subjects.forEach(function (s) {
    if (!isPlainObject(s)) return;
    var id = cleanStr(s.id, 40), name = cleanStr(s.name, 10).trim();
    if (!id || !name || seenSub[id]) return;
    seenSub[id] = true;
    subs.push({ id: id, name: name, fruit: cleanStr(s.fruit, 8) || '' });
  });
  if (subs.length) base.subjects = subs;

  /* 항목: 중복 번호는 첫 번째만 남기고, 과목이 없으면 첫 과목으로 옮김 */
  var items = [], seenItem = {};
  raw.items.forEach(function (x) {
    var it = cleanItem(x);
    if (!it || seenItem[it.id]) return;
    seenItem[it.id] = true;
    if (!base.subjects.some(function (s) { return s.id === it.subjectId; })) {
      it.subjectId = base.subjects[0].id;
    }
    items.push(it);
  });
  base.items = items;

  /* 공부 시간 기록: 날짜 형식과 숫자만 남김 */
  var sess = {};
  if (isPlainObject(raw.sessions)) {
    Object.keys(raw.sessions).forEach(function (day) {
      var m = raw.sessions[day];
      if (!DATE_RE.test(day) || !isPlainObject(m)) return;
      sess[day] = {};
      Object.keys(m).forEach(function (sid) {
        var v = m[sid];
        if (typeof v === 'number' && isFinite(v) && v >= 0) sess[day][sid] = Math.floor(v);
      });
    });
  }
  base.sessions = sess;

  /* 기상 도장 */
  var stamps = {};
  if (isPlainObject(raw.stamps)) {
    Object.keys(raw.stamps).forEach(function (day) {
      var s = raw.stamps[day];
      if (!DATE_RE.test(day) || !isPlainObject(s) || typeof s.time !== 'string') return;
      stamps[day] = { time: s.time.slice(0, 5), target: cleanStr(s.target, 5) || '07:00', ok: s.ok === true };
    });
  }
  base.stamps = stamps;

  /* 응원 기록: 친구 번호와 날짜가 맞는 것만, 하루 최대 횟수 안에서 */
  var cheers = {};
  FRIENDS.forEach(function (f) {
    var book = raw.cheers && raw.cheers[f.id];
    if (!isPlainObject(book)) return;
    cheers[f.id] = {};
    Object.keys(book).forEach(function (day) {
      var n = book[day];
      if (DATE_RE.test(day) && typeof n === 'number' && isFinite(n)) {
        cheers[f.id][day] = Math.max(0, Math.min(CHEER_LIMIT, Math.floor(n)));
      }
    });
  });
  base.cheers = cheers;

  var pr = isPlainObject(raw.profile) ? raw.profile : {};
  /* 기상 목표는 화면의 선택지(05:00~09:00, 30분 간격) 안에 있을 때만 씀 */
  var wakeOk = typeof pr.wakeTarget === 'string' && /^\d{2}:\d{2}$/.test(pr.wakeTarget) &&
    hmToMin(pr.wakeTarget) >= 300 && hmToMin(pr.wakeTarget) <= 540 && hmToMin(pr.wakeTarget) % 30 === 0;
  base.profile = {
    nickname: cleanStr(pr.nickname, 8).trim() || '나',
    wakeTarget: wakeOk ? pr.wakeTarget : '07:00'
  };

  var st = isPlainObject(raw.settings) ? raw.settings : {};
  base.settings = { confirmMinutes: [1, 10, 25].indexOf(st.confirmMinutes) >= 0 ? st.confirmMinutes : 25 };
  base.timeOffsetMs = numOrNull(raw.timeOffsetMs) || 0;

  /* 불러오는 순간 타이머가 돌고 있었어도 멈춘 상태로 */
  var tm = isPlainObject(raw.timer) ? raw.timer : {};
  base.timer = { running: false, subjectId: cleanStr(tm.subjectId, 40), startedAt: null, lastConfirmAt: null, promptOpenedAt: null };

  return sanitize(base);
}
function resetAll() {
  state = defaultState();
  ui.draft = { title: '', subjectId: state.subjects[0].id, category: 'concept', importance: 50 };
  ui.addingSubject = false;

  ui.notice = '';
  ui.showCopy = false;
  ui.copyNote = '';
  ui.restoreText = '';

  render();

}

/* ==========================================================
   16. 이벤트 연결 (화면을 다시 그려도 동작하도록 위임 방식)
   ========================================================== */
function act(name, el) {
  switch (name) {
    case 'tab':
      ui.tab = el.getAttribute('data-tab');
      render();
      window.scrollTo(0, 0);
      break;
    case 'open-add':
      ui.sheetOpen = true;
      ui.focusDraft = true;
      render();
      break;
    case 'close-add':
      ui.sheetOpen = false;
      render();
      break;
    case 'timer-toggle':
      if (state.timer.running) stopTimer(false); else startTimer();
      break;
    case 'confirm-yes': confirmStudy(); break;
    case 'cat':
      ui.draft.category = el.getAttribute('data-cat');
      render();
      break;
    case 'subj-toggle':
      ui.addingSubject = !ui.addingSubject;
      render();
      break;
    case 'subj-save': addSubject(); break;
    case 'add-item': addItem(); break;
    case 'toggle': toggleItem(el.getAttribute('data-id')); break;
    case 'stamp': doStamp(); break;
    case 'cheer': cheer(el.getAttribute('data-friend'), el.getAttribute('data-emoji')); break;
    case 'skip-day': skipDay(); break;
    case 'unskip': unskip(); break;
    case 'copy-data': copyData(); break;
    case 'copy-hide': hideCopyBox(); break;
    case 'export': exportBackup(); break;
    case 'file-pick': pickBackupFile(); break;
    case 'paste-import':
      var box = document.getElementById('restoreBox');
      handleImportText(box ? box.value : ui.restoreText);
      break;
    case 'import-yes': applyImport(); break;
    case 'reset-ask': setDialog('reset'); break;
    case 'reset-yes': resetAll(); break;
    case 'dialog-cancel': setDialog(null); break;
  }
}

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (el) act(el.getAttribute('data-act'), el);
});

document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'draftTitle') {
    ui.draft.title = e.target.value;
  } else if (id === 'impSlider') {
    ui.draft.importance = +e.target.value;
    setText('firstPreview', previewText(ui.draft.importance));
  } else if (id === 'stabSlider') {
    ui.demoS = +e.target.value;
    setText('sVal', String(ui.demoS));
    updateGraph();
  } else if (id === 'restoreBox') {
    /* 다시 그려도 붙여 넣은 글이 남도록 보관 */
    ui.restoreText = e.target.value;
  }
});

document.addEventListener('change', function (e) {
  var id = e.target.id;
  var name = e.target.name;
  var v = e.target.value;
  if (name === 'timerSubj') {
    ui.timerSubject = v;
    render();
  } else if (name === 'draftSubj') {
    ui.draft.subjectId = v;
    render();
  } else if (id === 'wakeSelect') {
    state.profile.wakeTarget = v;
    save();
  } else if (id === 'nickInput') {
    state.profile.nickname = (v || '').trim().slice(0, 8) || '나';
    save();
    render();
  } else if (id === 'confirmSelect') {
    state.settings.confirmMinutes = +v;
    save();
    render();
  } else if (id === 'fileInput') {
    /* 같은 파일을 다시 고를 수 있도록 값을 비움 */
    var picked = e.target.files && e.target.files[0];
    e.target.value = '';
    if (picked) readBackupFile(picked);
  }
});

/* 접는 줄(details)을 열고 닫은 상태를 기억해서, 다시 그려도 그대로 두기 */
document.addEventListener('toggle', function (e) {
  var el = e.target;
  if (el && el.tagName === 'DETAILS' && el.getAttribute('data-more')) {
    ui.openMore[el.getAttribute('data-more')] = el.open;
  }
}, true);

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'draftTitle') addItem();
  else if (e.target.id === 'newSubjectInput') addSubject();
});

document.addEventListener('visibilitychange', tick);

/* 앱을 끄거나 다른 앱으로 갈 때 기록을 미리 저장 */
window.addEventListener('pagehide', function () { save(); });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') save();
});

/* ==========================================================
   17. 시작
   ========================================================== */
setText('appName', APP_NAME);
document.title = APP_NAME;
render();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
